name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    name: macOS Universal 2
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/desktop/package-lock.json }
      - run: npm ci
        working-directory: apps/desktop

      # Signing and notarisation are skipped when the secrets are absent, so a
      # fork can still produce a working unsigned build. An unsigned build is
      # useful for testing and useless for distribution — see docs/releasing.md.
      - name: Build
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --target universal-apple-darwin

      - name: Verify both architectures are present
        run: |
          BIN=target/universal-apple-darwin/release/bundle/macos/MouseBridge.app/Contents/MacOS/mousebridge-desktop
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64
          lipo -info "$BIN" | grep -q arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          # Native ARM64 runner. Cross-compiling would work for the Rust, but
          # WebView2 and the bundler are happier building natively.
          - { arch: arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/desktop/package-lock.json }
      - run: npm ci
        working-directory: apps/desktop

      - name: Build
        working-directory: apps/desktop
        run: npx tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
