[package]
name = "mb-clipboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Clipboard content model and synchronisation rules for MouseBridge."

# No logger, for the same reason as `mb-input`: clipboard contents must never
# reach a log, and the surest way to guarantee that is to have nothing to log to.
[dependencies]
mb-types = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
