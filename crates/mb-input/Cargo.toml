[package]
name = "mb-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform-independent input event model and capture/injection traits."

# NOTE: this crate deliberately has no `tracing` dependency and no async runtime.
# Both are structural guarantees rather than conventions:
#   * No logger means no code path can log a keystroke. The prohibition on
#     logging input is enforced by the dependency graph, not by review.
#   * No async runtime means the input path cannot accidentally await, block on a
#     reactor, or inherit an executor's scheduling latency.
[dependencies]
mb-types = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = "1"

[lints]
workspace = true
