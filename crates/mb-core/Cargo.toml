[package]
name = "mb-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MouseBridge orchestration: application state, logging, status reporting."

[dependencies]
mb-types = { workspace = true }
mb-config = { workspace = true }
mb-platform = { workspace = true }
mb-input = { workspace = true }
mb-protocol = { workspace = true }
mb-net = { workspace = true }
mb-topology = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
mb-security = { workspace = true }

[lints]
workspace = true
